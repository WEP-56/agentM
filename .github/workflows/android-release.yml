name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: uiux-design/package-lock.json
      - name: Check tag and release notes
        id: version
        run: node tools/release/check-version.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install frontend dependencies
        run: npm ci --prefix uiux-design --no-audit --no-fund
      - name: Verify bundled dependency notices
        run: node tools/release/web-licenses.mjs
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret. See docs/20-GitHub发布.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentm-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/agentm-release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
      - name: Test, lint and build release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/agentm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Package runtime sources
        run: python3 tools/release/bundle-runtime-sources.py
      - name: Verify APK and prepare assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="output/release/agentM-${VERSION}-universal.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > output/release/SIGNING-CERT.txt
          cat output/release/SIGNING-CERT.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          cp "docs/releases/v${VERSION}.md" output/release/RELEASE-NOTES.md
          cd output/release
          sha256sum "agentM-${VERSION}-universal.apk" linux-runtime-sources.tar.gz SIGNING-CERT.txt > SHA256SUMS.txt
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/agentm-release.jks"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: output/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish verified assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS.txt
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo '::error::This release is already public. Publish a new version instead of replacing its assets.'
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "agentM $TAG" --notes-file RELEASE-NOTES.md "${prerelease[@]}"
          fi
          gh release upload "$TAG" ./*.apk linux-runtime-sources.tar.gz SHA256SUMS.txt SIGNING-CERT.txt --clobber
          gh release edit "$TAG" --draft=false "${prerelease[@]}"
